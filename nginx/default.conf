upstream nodejs_app {
    # "app" is the Docker Compose service name for the Node.js container.
    # Docker's internal DNS resolves it to the container's IP.
    server app:5000;
}

server {
    listen 80;
    server_name _;

    # Basic request logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        proxy_pass http://nodejs_app;
        proxy_http_version 1.1;

        # Forward useful headers so the app sees the real client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Lightweight endpoint Nginx itself answers, useful for load balancer checks
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
