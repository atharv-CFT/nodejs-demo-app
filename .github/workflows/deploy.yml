name: CI/CD - Build, Push, Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-demo-app

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Basic sanity check — confirms the project structure is valid
      # before spending time on a Docker build. Full integration testing
      # (with a real DB) would need a `services:` Postgres container in CI.
      - name: Sanity check
        run: node -e "require('./package.json'); console.log('package.json OK')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose & nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,nginx/default.conf"
          target: "~/nodejs-demo-app"

      - name: SSH in and redeploy with docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/nodejs-demo-app

            # IMAGE_NAME / IMAGE_TAG override the defaults in docker-compose.yml
            # so `docker compose pull` fetches the image just built in CI
            # instead of building it again on the server.
            {
              echo "IMAGE_NAME=${{ env.IMAGE_NAME }}"
              echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}"
            } >> .env.deploy
            # Merge into the real .env that already holds MONGO_URL etc.,
            # which is created once on the server and never committed to git.
            grep -q '^IMAGE_NAME=' .env 2>/dev/null && sed -i '/^IMAGE_NAME=/d;/^IMAGE_TAG=/d' .env
            cat .env.deploy >> .env
            rm .env.deploy

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose pull app
            docker compose up -d
            docker image prune -f